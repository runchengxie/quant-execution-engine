[project]
name = "quant-execution-engine"
version = "0.2.0"
requires-python = ">=3.11, <3.13"

dependencies = [
  "pyyaml",
]

[dependency-groups]
dev = [
  "pip-audit>=2.7",
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.5",
  "ty>=0.0.55",
  "research-dev-metrics",
]

[project.optional-dependencies]
cli = ["rich>=13"]
longport = ["longport>=0.2.77"]
alpaca = ["alpaca-py", "pytz"]
ibkr = ["ib-insync>=0.9.86"]
full = [
  "longport>=0.2.77",
  "alpaca-py",
  "pytz",
  "ib-insync>=0.9.86",
]

[project.scripts]
stockq = "quant_execution_engine.cli:app"
qexec = "quant_execution_engine.cli:app"

[tool.uv.sources]
research-dev-metrics = { git = "https://github.com/runchengxie/research-dev-metrics.git", rev = "e1d6e278b0645a23adb523ada9fa8d4743c2e3bf" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_execution_engine*"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Select rule sets to enable.
# "E", "F" correspond to Flake8's native rules.
# "I" corresponds to isort.
# "UP" corresponds to pyupgrade.
# "SIM"/"RUF"/"RET" added 2026-07-26 to align with the other workspace
# submodules' broad Ruff gate (previously only E,F,I,UP,B,C90).
select = ["E", "F", "I", "UP", "B", "C90", "SIM", "RUF", "RET"] # B is flake8-bugbear
allowed-confusables = ["：", "，", "；", "（", "）"]

# Or, enable all rules and then ignore the ones you don't need
# select = ["ALL"]
# ignore = ["D100", "D101"] # Ignore specific rules


[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# Temporary: the broad command dispatcher / run_config() remain complex while
# broker/execution command groups are being extracted behind focused tests.
# Tracked in docs/quality-coverage-governance.yml per_file_ignore_register; remove
# after the CLI command-family split (next qexec 2.0 release review).
"src/quant_execution_engine/cli/__init__.py" = ["C901", "E402"]
"src/quant_execution_engine/cli/commands/account.py" = ["C901"]
# Compatibility facade: runs a sys.path bootstrap before importing the
# project_tools.smoke_operator package so it can be executed as a standalone
# script. The bootstrap is intentional code before the package import.
"project_tools/smoke_operator_harness.py" = ["E402"]
# Standalone offline evidence harness: same sys.path bootstrap before the
# package import.
"project_tools/evidence_offline_chain.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "scripts", "tests"]
exclude = [
  ".venv",
  "outputs",
  "build",
  "dist",
]

[tool.ty.rules]
redundant-cast = "ignore"
# Optional broker SDKs (longport/longbridge) are not installed in the base venv;
# their imports are guarded at runtime. Keep unresolved-import ignored so base
# typecheck does not require the optional `longport`/`ibkr` extras.
unresolved-import = "ignore"

[tool.coverage.run]
source = ["src/quant_execution_engine"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e and not slow'"
markers = [
  "unit: fast, isolated tests",
  "integration: tests that touch external APIs or DB",
  "e2e: end-to-end workflow tests",
  "slow: long-running tests",
  "requires_api: needs external API access",
  "requires_db: needs database access",
]
filterwarnings = [
  "error::DeprecationWarning",
  "ignore:.*distutils.*:DeprecationWarning",
]
